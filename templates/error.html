{% extends 'base.html' %}

{% block title %}Error {{ error_code }}{% endblock %}
{% block page_title %}System Notification{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="card shadow-sm border-0 p-5">
            <div class="mb-3">
                <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size: 4rem;"></i>
            </div>
            <h2 class="fw-bold mb-2">Error {{ error_code }}</h2>
            <p class="text-muted mb-4">{{ message }}</p>
            <div>
                <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4 py-2">
                    <i class="bi bi-house-door-fill me-1"></i> Return to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
